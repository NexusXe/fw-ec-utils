<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow the service to own its name -->
  <policy user="root">
    <allow own="org.nexusxe.FwChargemon"/>
  </policy>

  <!-- Allow any user to call methods and read properties -->
  <policy context="default">
    <allow send_destination="org.nexusxe.FwChargemon"/>
    <allow receive_sender="org.nexusxe.FwChargemon"/>
  </policy>
</busconfig>
